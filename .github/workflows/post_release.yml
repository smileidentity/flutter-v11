name: Post-Release Actions

on:
  release:
    types:
      - created
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to publish notes for (used when invoked from CI)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish notes for (e.g. v11.2.10)'
        required: true
        type: string

jobs:
  update-docs-release-notes:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout flutter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: flutter
      - name: Checkout docs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: smileidentity/docs
          path: docs
          token: ${{ secrets.GH_PAT }}
      - name: Copy CHANGELOG.md to Release Notes
        run: cp flutter/CHANGELOG.md docs/integration-options/mobile/flutter-v10/release-notes.md
      - name: Create docs PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GH_PAT }}
          path: docs
          commit-message: Flutter ${{ env.RELEASE_TAG }} Release Notes
          title: Flutter ${{ env.RELEASE_TAG }} Release Notes
          body: Automated PR to update the release notes
          branch: flutter-release-notes-${{ env.RELEASE_TAG }}
          labels: "release-notes"
          team-reviewers: "smileidentity/mobile"
