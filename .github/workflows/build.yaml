name: Lint Build and Test
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.32.0" # Set the desired Flutter version here
          channel: "stable"
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..
      - name: Lint Flutter
        run: dart format . --set-exit-if-changed && flutter analyze
  Android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
    timeout-minutes: 10
    strategy:
      matrix:
        flutter-version: ["3.32.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: "stable"
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..
      - name: Lint Android
        uses: musichin/ktlint-check@cfe7ae31e0fab752f613bb1d0cf04325f18a2d22 # v4
        with:
          ktlint-version: "1.7.0"
          patterns: |
            **/**.kt
            !**/**.g.kt
            !**/generated/**
      - name: Test
        run: flutter test && cd sample && flutter test && cd ..
      - name: Build Android Sample App
        run: cd sample && flutter build apk && cd ..
  iOS:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # CocoaPods path — the floor we still support.
          - name: cocoapods
            flutter-version: "3.32.0"
          # Swift Package Manager path — the default for partners on 3.44+.
          - name: swiftpm
            flutter-version: "3.44.0"
    name: iOS (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: touch sample/ios/smile_config.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: "stable"
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"
      - name: Verify iOS native pins match across CocoaPods and SwiftPM
        run: bash scripts/verify_native_pins.sh
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..

      # Both legs run pod install (the sample keeps its Podfile), so pin CocoaPods for both.
      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1
        with:
          version: 1.14.3

      # --- CocoaPods mode ---
      - name: Disable Swift Package Manager
        if: ${{ matrix.name == 'cocoapods' }}
        run: flutter config --no-enable-swift-package-manager
      # --allow-warnings: the podspec has pre-existing lint warnings; errors still fail.
      - name: Lint podspec
        if: ${{ matrix.name == 'cocoapods' }}
        run: pod lib lint ios/smile_id.podspec --configuration=Debug --skip-tests --use-modular-headers --allow-warnings
      - name: Build iOS Sample App (CocoaPods)
        if: ${{ matrix.name == 'cocoapods' }}
        run: cd sample/ios && pod install && cd .. && flutter build ios --no-codesign

      # --- Swift Package Manager mode ---
      - name: Enable Swift Package Manager
        if: ${{ matrix.name == 'swiftpm' }}
        run: flutter config --enable-swift-package-manager
      - name: Cache Swift Package Manager downloads
        if: ${{ matrix.name == 'swiftpm' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/smile_id/Package.swift', 'sample/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build iOS Sample App (Swift Package Manager)
        if: ${{ matrix.name == 'swiftpm' }}
        run: cd sample && flutter build ios --no-codesign
      - name: Assert the plugin resolved through Swift Package Manager
        if: ${{ matrix.name == 'swiftpm' }}
        run: |
          # Ephemeral layout is a Flutter tool internal (verified on 3.44.0).
          pkgs=sample/ios/Flutter/ephemeral/Packages/.packages
          generated=sample/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          test -e "$pkgs/FlutterFramework" || { echo "FlutterFramework missing from $pkgs: SwiftPM was not used, or the Flutter tool layout changed"; exit 1; }
          # The plugin symlink is named after the checkout directory, so find it by target.
          plugin_link=""
          for link in "$pkgs"/*; do
            case "$(readlink "$link")" in */ios/smile_id) plugin_link="$link" ;; esac
          done
          test -n "$plugin_link" || { echo "no symlink in $pkgs points at ios/smile_id: the plugin fell back to CocoaPods, or the Flutter tool layout changed"; exit 1; }
          test -f "$plugin_link/Package.swift" || { echo "$plugin_link does not contain Package.swift"; exit 1; }
          grep -q 'package: "smile_id"' "$generated" || { echo "smile_id is not a target dependency in $generated"; exit 1; }
          # Durable counter-signal: under SwiftPM the plugin must leave the pod graph.
          ! grep -q 'smile_id' sample/ios/Podfile.lock || { echo "smile_id is still in sample/ios/Podfile.lock — the plugin did not leave the CocoaPods graph"; exit 1; }
      - name: Assert the committed SwiftPM resolution is still current
        if: ${{ matrix.name == 'swiftpm' }}
        run: git diff --exit-code -- sample/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
