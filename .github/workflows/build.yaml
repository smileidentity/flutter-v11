name: Lint Build and Test
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.32.0" # Set the desired Flutter version here
          channel: "stable"
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..
      - name: Lint Flutter
        run: dart format . --set-exit-if-changed && flutter analyze
  Android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
    timeout-minutes: 10
    strategy:
      matrix:
        flutter-version: ["3.32.0"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: "stable"
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..
      - name: Lint Android
        uses: musichin/ktlint-check@cfe7ae31e0fab752f613bb1d0cf04325f18a2d22 # v4
        with:
          ktlint-version: "1.7.0"
          patterns: |
            **/**.kt
            !**/**.g.kt
            !**/generated/**
      - name: Test
        run: flutter test && cd sample && flutter test && cd ..
      - name: Build Android Sample App
        run: cd sample && flutter build apk && cd ..
  iOS:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: touch sample/ios/smile_config.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.32.0" # Set the desired Flutter version here
          channel: "stable"
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"
      - name: Setup Cocoapods
        uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1
        with:
          version: 1.14.3
      - name: Install Dependencies
        run: flutter pub get && cd sample && flutter pub get && cd ..
      - name: Build iOS Sample App
        run: cd sample/ios && pod install && flutter build ios --no-codesign && cd ..
