name: Release Flutter SDK
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deployment:
    name: Deploy package
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: Flutter action
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
      - name: Read pubspec version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r' | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "pubspec version '$VERSION' is not a valid semver" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches pubspec version
        run: |
          EXPECTED="v${{ steps.version.outputs.version }}"
          ACTUAL="${{ github.ref_name }}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Tag ${ACTUAL} does not match pubspec version (expected ${EXPECTED})" >&2
            exit 1
          fi
      - name: Extract changelog for version
        id: changelog
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            BEGIN { gsub(/\./, "\\.", ver); pattern = "^#+ " ver "([[:space:]]|$)" }
            $0 ~ pattern { capture=1; next }
            capture && /^#+ [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md entry found for ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
      - name: Publish package
        run: flutter pub publish -v -f
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

  post-release:
    name: Post-release actions
    needs: deployment
    uses: ./.github/workflows/post_release.yml
    with:
      tag_name: ${{ needs.deployment.outputs.tag }}
    secrets: inherit
